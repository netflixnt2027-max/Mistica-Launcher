name: Gerar APK Mística

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restaurar logo
        run: base64 --decode assets/logo_mistica.png.b64 > app/src/main/res/drawable/logo_mistica.png

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mistica-Launcher-v1.0.0.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mistica-Launcher-APK
          path: Mistica-Launcher-v1.0.0.apk
          retention-days: 90
